[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catduck-hermes-local-broker-providers"
version = "1.1.0"
description = "Hermes provider profiles and standalone loopback OAuth broker runtime"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "pyyaml>=6.0",
  "requests>=2.31",
  "rich>=13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
catduck-hermes-broker = "broker_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["broker_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
